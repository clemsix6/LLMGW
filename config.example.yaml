host: 0.0.0.0
port: 8088
auth-dir: /var/lib/llmgw/cliproxy-auth
disable-image-generation: true

remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true

home:
  enabled: false

pprof:
  enable: false

request-log: false
request-retry: 1
max-retry-credentials: 2
max-retry-interval: 5
transient-error-cooldown-seconds: -1
disable-cooling: false
save-cooldown-status: false

routing:
  strategy: round-robin
  # Sticky sessions pin every turn of one conversation to the same upstream
  # account. Anthropic's prompt cache lives per account, so without this a
  # multi-turn agent loop round-robins across accounts and re-pays its whole
  # context as a cache write on almost every turn.
  session-affinity: true

llmgw:
  postgres-dsn-env: LLMGW_POSTGRES_DSN
  key-pepper-env: LLMGW_KEY_PEPPER
  discord-webhook-url-env: LLMGW_DISCORD_WEBHOOK_URL
  usage-retention-days: 35
  usage-outstanding-capacity: 64
