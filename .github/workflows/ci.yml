name: CI

# The job is hermetic: it exercises the governed embedded SDK with local
# testcontainers and fixture upstreams. It intentionally has no live provider
# credentials; operator-owned live verification is gated by LLMGW_LIVE_CONFIG.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build, vet & unit tests
    runs-on: ubuntu-latest
    env:
      # CI runners are ephemeral; the testcontainers reaper is unnecessary and flaky there.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: Domain and adapter tests
        run: go test -race ./internal/... -count=1

      - name: Embedded CLIProxy integration
        run: go test ./test/integration -count=1 -v
